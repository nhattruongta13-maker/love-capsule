apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend             #This specifies the name of the deployment
  namespace: love-capsule   #This specifies the namespace in which the deployment will be created
spec:
  replicas: 2            #This specifies the number of pod replicas to run for the deployment
  selector:              #This specifies how the deployment finds which pods to manage
    matchLabels:         #This specifies the labels that the deployment will use to identify the pods it manages
      app: backend       #This tells the deployment which pods to manage based on their labels
  template:              #This defines the pod template for the deployment
    metadata:
      labels:
        app: backend     #This label must match the selector above
    spec:
      containers:
        - name: backend
          image: love-capsule-backend:k8s   #This specifies the Docker image to use for the backend container
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5034
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:5034
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: love-capsule-secrets
                  key: postgres-password
            - name: ConnectionStrings__DefaultConnection
              value: Host=postgres;Port=5432;Database=lovecapsule;Username=lovecapsule;Password=$(POSTGRES_PASSWORD)
            - name: ConnectionStrings__Redis
              value: redis:6379
            - name: Jwt__Issuer
              value: LoveCapsule.Api
            - name: Jwt__Audience
              value: LoveCapsule.Frontend
            - name: Jwt__SigningKey
              valueFrom:
                secretKeyRef:
                  name: love-capsule-secrets
                  key: jwt-signing-key
            - name: Llm__BaseUrl
              valueFrom:
                configMapKeyRef:
                  name: love-capsule-config
                  key: llm-base-url
            - name: Security__AuthRateLimit__PermitLimit
              value: "1000"
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 5034
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5034
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: love-capsule
spec:
  selector:
    app: backend
  ports:
    - port: 5034
      targetPort: 5034
