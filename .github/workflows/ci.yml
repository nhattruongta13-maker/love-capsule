name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Testing
      Jwt__SigningKey: test-only-signing-key-used-by-ci
      Security__AuthRateLimit__PermitLimit: 1000
      Security__AuthRateLimit__WindowSeconds: 60
      Security__AuthRateLimit__SegmentsPerWindow: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            backend/LoveCapsule.Api.csproj
            backend.Tests/LoveCapsule.Api.Tests.csproj

      - name: Restore backend dependencies
        run: dotnet restore backend.Tests/LoveCapsule.Api.Tests.csproj

      - name: Download embedding model
        run: |
          mkdir -p backend/EmbeddingModel
          curl -fsSL -o backend/EmbeddingModel/model.onnx "https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model_qint8_arm64.onnx"
          curl -fsSL -o backend/EmbeddingModel/vocab.txt "https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/vocab.txt"

      - name: Build backend
        run: dotnet build backend/LoveCapsule.Api.csproj --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test backend.Tests/LoveCapsule.Api.Tests.csproj --configuration Release --no-restore --verbosity normal

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
